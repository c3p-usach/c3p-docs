# Redirects /pagina/ to /pagina.html: the site is built with use_directory_urls: false, and the 29-10 announcement email linked /.../ addresses.
# Goes in /etc/nginx/sites-enabled/c3p, inside the HTTPS server block (root /var/www/c3p), right after  location / { try_files $uri $uri/ =404; }
# Live on c3p since 29-10-2026. Serving the .html at the /.../ address instead breaks CSS/JS (relative paths), hence the redirect.
location ~ ^/(?<pagina>.+)/$ {
    if (-f $document_root/$pagina.html) { return 301 /$pagina.html; }
    try_files $uri ${uri}index.html =404;
}
