name: CI

# Cada push y cada PR: build estricto (MkDocs detiene el build ante enlaces internos
# rotos) y revisión de enlaces internos en el HTML generado (lychee --offline: no
# consulta sitios externos, solo archivos y anclas del propio sitio).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      - name: Enlaces internos
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            --root-dir ${{ github.workspace }}/site
            'site/**/*.html'
          fail: true
