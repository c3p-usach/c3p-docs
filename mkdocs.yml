site_name: C3P · Clúster Chuchunco
site_description: Guía de usuario del clúster de cómputo de alto rendimiento del Departamento de Física, USACH
site_url: https://c3p.usach.cl/     # también da el <link rel="canonical"> (el espejo en GitHub Pages apunta aquí)
copyright: Departamento de Física · Universidad de Santiago de Chile · FONDEQUIP EQM230160
use_directory_urls: false   # enlaces .html: funciona en servidor y abriendo los archivos locales
theme:
  name: material
  language: es
  logo: assets/logo-c3p.svg
  favicon: assets/logo-c3p.svg
  font:
    text: Nunito Sans          # tipografía recomendada por el Manual de Normas Gráficas USACH
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Cambiar a modo oscuro}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Cambiar a modo claro}
extra_css:
  - stylesheets/usach.css
extra:
  # Formularios: una URL por formulario, y solo aquí. Las páginas los nombran por clave
  # ({{ formulario-enlace: clave }} y {{ formulario: clave }}, ver hooks/formularios.py).
  # Una URL https://docs.google.com/forms/d/e/<id>/viewform se muestra incrustada;
  # un enlace corto (forms.gle) solo como enlace. Clave vacía = formulario aún no publicado.
  formularios:
    productos: https://docs.google.com/forms/d/e/1FAIpQLSfI1MfVD0tsPd8-5fCGyTCOsg_QXHBOSrO7F3h5fhsr_i5B3w/viewform   # F4 · registro de productos (P1.1, instalado 2026-10-23)
    proyecto: https://docs.google.com/forms/d/e/1FAIpQLSfnRfVpQv8dpDBU4JNr18iVr9wk5zru3sF0FYOVL01DSkopYg/viewform     # F1 · solicitar un proyecto (PI)
    unirse: https://docs.google.com/forms/d/e/1FAIpQLSdddxaB4pBQLOvDKulJOj7pRl4lhFFGbJINcb-FxzglfcNo6w/viewform       # F2 · unirse a un proyecto (cuenta)
    soporte:      # F3 · soporte
hooks:
  - hooks/formularios.py
plugins:
  - search:
      lang: es
  - offline                  # permite abrir site/index.html directamente (búsqueda incluida)
validation:                # con --strict, cualquier enlace interno roto detiene el build
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc: {permalink: true}
nav:
  - Inicio: index.md
  - Acceso:
      - Solicitar una cuenta: acceso/solicitar-cuenta.md
      - Solicitar un proyecto: acceso/solicitar-proyecto.md
      - Unirse a un proyecto: acceso/unirse.md
      - Conectarse por SSH: acceso/conectarse.md
      - Reglas de uso: acceso/reglas.md
  - Uso del clúster:
      - Tu primer trabajo: uso/primeros-pasos.md
      - "Slurm: colas y límites": uso/slurm.md
      - Software y Python: uso/software.md
      - Ejemplos de trabajos: uso/ejemplos.md
      - GPUs: uso/gpu.md
      - Contenedores (Pyxis/Enroot): uso/contenedores.md
      - Almacenamiento y datos: uso/almacenamiento.md
  - Preguntas frecuentes: faq.md
  - Agradecimientos y productos: agradecimientos.md
  - Contacto: contacto.md
